<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damage Formula Visualizer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: white;
        padding: 30px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: #2b2b2b;
        padding: 25px;
        border-radius: 12px;
    }

    h1 {
        margin-bottom: 25px;
    }

    .slider-group {
        margin-bottom: 30px;
    }

    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    label {
        font-weight: bold;
    }

    input[type=range] {
        width: 100%;
    }

    input[type=number] {
        width: 90px;
        padding: 6px;
        border-radius: 6px;
        border: none;
        font-size: 14px;
    }

    .result {
        margin-top: 35px;
        padding: 20px;
        background: #151515;
        border-radius: 10px;
        font-size: 24px;
        font-weight: bold;
    }

    .formula {
        margin-top: 15px;
        color: #cccccc;
        font-size: 14px;
        line-height: 1.5;
    }

    .relation {
        margin-top: 10px;
        color: #8fd3ff;
        font-size: 18px;
    }
</style>
</head>
<body>

<div class="container">

    <h1>Damage Formula Visualizer</h1>

    <div class="slider-group">
        <div class="top-row">
            <label for="atk">ATK</label>
            <input type="number" id="atkInput" min="1" max="5000" value="100">
        </div>
        <input type="range" id="atk" min="1" max="5000" value="100">
    </div>

    <div class="slider-group">
        <div class="top-row">
            <label for="trainedAtk">Trained ATK</label>
            <input type="number" id="trainedAtkInput" min="0" max="5000" value="50">
        </div>
        <input type="range" id="trainedAtk" min="0" max="5000" value="50">
    </div>

    <div class="slider-group">
        <div class="top-row">
            <label for="def">DEF</label>
            <input type="number" id="defInput" min="1" max="5000" value="100">
        </div>
        <input type="range" id="def" min="1" max="5000" value="100">
    </div>

    <div class="result">
        Damage: <span id="damage">150.00</span>

        <div class="relation">
            Relation Multiplier: <span id="relation">1.00</span>
        </div>
    </div>

    <div class="formula">
        If ATK ≤ DEF:<br>
        Relation = ATK / DEF
        <br><br>
        If ATK > DEF:<br>
        Relation = √(ATK / DEF)
        <br><br>
        Damage = (ATK + TrainedATK) × Relation
    </div>

</div>

<script>

    const atkSlider = document.getElementById('atk');
    const trainedAtkSlider = document.getElementById('trainedAtk');
    const defSlider = document.getElementById('def');

    const atkInput = document.getElementById('atkInput');
    const trainedAtkInput = document.getElementById('trainedAtkInput');
    const defInput = document.getElementById('defInput');

    const damageText = document.getElementById('damage');
    const relationText = document.getElementById('relation');

    function sync(slider, input) {
        slider.value = input.value;
    }

    function syncReverse(slider, input) {
        input.value = slider.value;
    }

    function updateDamage() {

        const atk = parseFloat(atkSlider.value);
        const trainedAtk = parseFloat(trainedAtkSlider.value);
        const defValue = parseFloat(defSlider.value);

        let relation = atk / defValue;

        if (relation >= 1) {
            relation = Math.sqrt(relation);
        }

        const damage = (atk + trainedAtk) * relation;

        damageText.textContent = damage.toFixed(2);
        relationText.textContent = relation.toFixed(4);
    }

    atkSlider.addEventListener('input', () => {
        syncReverse(atkSlider, atkInput);
        updateDamage();
    });

    trainedAtkSlider.addEventListener('input', () => {
        syncReverse(trainedAtkSlider, trainedAtkInput);
        updateDamage();
    });

    defSlider.addEventListener('input', () => {
        syncReverse(defSlider, defInput);
        updateDamage();
    });

    atkInput.addEventListener('input', () => {
        sync(atkSlider, atkInput);
        updateDamage();
    });

    trainedAtkInput.addEventListener('input', () => {
        sync(trainedAtkSlider, trainedAtkInput);
        updateDamage();
    });

    defInput.addEventListener('input', () => {
        sync(defSlider, defInput);
        updateDamage();
    });

    updateDamage();

</script>

</body>
</html>
